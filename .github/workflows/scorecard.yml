name: Open scorecard
# 14:20 UTC = 9:20 ET (winter): save the board before the open.
# 15:30 UTC = 10:30 ET: score it one hour after the open.
# Shift both by -1h when US daylight time starts (Mar 8, 2027).
on:
  schedule:
    - cron: '20 14 * * 1-5'
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      mode: { description: 'predict or score', required: true, default: 'predict' }
permissions:
  contents: write
concurrency: { group: scorecard, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "20 14 * * 1-5" ]; then MODE=predict; else MODE=score; fi
          fi
          node scripts/scorecard.mjs "$MODE"
      - name: Commit results
        run: |
          git config user.name "after-hours-bot"
          git config user.email "after-hours-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "scorecard: $(date -u +%Y-%m-%d) ${{ github.event.inputs.mode || 'scheduled' }}"
          git push
