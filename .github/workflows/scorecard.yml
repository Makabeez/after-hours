name: Open scorecard (manual fallback)
# Scheduled runs were removed: GitHub started them 9-11 hours late on Nov 23-24, after the market had closed.
# The scorecard runs on time from scripts/scorecard-daemon.mjs (PM2 on an always-on machine).
# This workflow stays as a manual fallback; scorecard.mjs refuses to predict after the open or score outside 50-120 min after it.
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'predict or score', required: true, default: 'predict' }
permissions:
  contents: write
concurrency: { group: scorecard, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/scorecard.mjs "${{ github.event.inputs.mode }}"
      - name: Commit results
        run: |
          git config user.name "after-hours-bot"
          git config user.email "after-hours-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "scorecard: manual ${{ github.event.inputs.mode }}"
          git push
